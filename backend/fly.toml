app = "gordon-platform"
primary_region = "iad"

[build]

[env]
  GORDON_DB = "/data/gordon.db"

[mounts]
  source = "gordon_data"
  destination = "/data"

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
