<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;              /* window is transparent — see desktop through it */
    overflow: hidden;
    font-family: 'Space Grotesk', -apple-system, system-ui, sans-serif;
    -webkit-user-select: none;
  }
  /* stage anchors content to bottom-right, matches overlay spec */
  #stage {
    position: absolute; right: 12px; bottom: 12px;
    display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
    opacity: 0; transform: translateY(8px); pointer-events: none;
    transition: opacity .28s ease, transform .28s ease;
  }
  #stage.show { opacity: 1; transform: translateY(0); pointer-events: auto; }

  /* device status strip */
  .devices {
    display: flex; gap: 6px; padding: 6px; border-radius: 11px;
    background: oklch(0.17 0.014 268 / 0.9); backdrop-filter: blur(14px);
    border: 1px solid oklch(0.29 0.02 268);
  }
  .chip {
    display: flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 7px;
    font: 500 9.5px/1 'IBM Plex Mono', monospace; letter-spacing: .04em;
    background: oklch(0.2 0.016 268); border: 1px solid oklch(0.28 0.02 268);
    color: oklch(0.72 0.015 268);
  }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: oklch(0.6 0.11 155); }
  .chip.firing {
    background: oklch(0.32 0.1 32); border-color: oklch(0.65 0.17 32); color: oklch(0.9 0.13 40);
    animation: gflash .5s ease 3;
  }
  .chip.firing .dot { background: oklch(0.8 0.19 32); }
  @keyframes gflash { 50% { filter: brightness(1.6); } }

  /* card shell */
  .card {
    width: 418px; border-radius: 16px; overflow: hidden;
    background: oklch(0.165 0.016 268 / 0.96); backdrop-filter: blur(24px);
    border: 1px solid oklch(0.42 0.09 40);
    box-shadow: 0 30px 80px -24px oklch(0.04 0.02 268), 0 0 0 1px oklch(0.1 0.01 268 / 0.6);
    animation: gpop .42s cubic-bezier(.2,1.2,.3,1);
  }
  @keyframes gpop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* waveform head */
  .head {
    padding: 14px 16px 12px; border-bottom: 1px solid oklch(0.26 0.02 268);
    background: linear-gradient(180deg, oklch(0.3 0.09 40 / 0.6), transparent);
  }
  .head-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .persona { font: 700 12px/1 'Space Grotesk', sans-serif; color: oklch(0.94 0.008 268); }
  .voice { font: 500 9px/1 'IBM Plex Mono', monospace; letter-spacing: .06em; color: oklch(0.72 0.17 48);
           border: 1px solid oklch(0.32 0.02 268); border-radius: 5px; padding: 3px 6px; margin-left: 8px; }
  .head-btns { display: flex; gap: 6px; }
  .hbtn { border: 1px solid oklch(0.3 0.02 268); background: transparent; color: oklch(0.6 0.015 268);
          font: 500 9px/1 'IBM Plex Mono', monospace; padding: 5px 7px; border-radius: 6px; cursor: pointer; }
  .hbtn:hover { color: oklch(0.9 0.01 268); }
  .hbtn.close { font-size: 12px; padding: 5px 9px; color: oklch(0.7 0.09 32); border-color: oklch(0.4 0.06 32); }
  .hbtn.close:hover { color: oklch(0.9 0.15 32); background: oklch(0.25 0.06 32); }
  /* muted state: waveform freezes flat, tint cools down */
  .card.muted .head { background: linear-gradient(180deg, oklch(0.22 0.02 268 / 0.5), transparent); }
  .card.muted .wave span { animation: none !important; height: 4px !important;
    background: oklch(0.42 0.03 268) !important; }
  .card.muted .status { color: oklch(0.52 0.015 268); }
  .wave { display: flex; align-items: center; justify-content: center; gap: 2px; height: 56px; margin-top: 10px; }
  .wave span { width: 3px; border-radius: 2px;
    background: linear-gradient(180deg, oklch(0.85 0.15 58), oklch(0.62 0.2 26));
    transition: height .25s ease; }
  .status { text-align: center; margin-top: 8px;
    font: 400 9.5px/1 'IBM Plex Mono', monospace; letter-spacing: .14em; color: oklch(0.82 0.14 45); }

  /* verdict body */
  .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 13px;
          max-height: 60vh; overflow-y: auto; }
  .scorerow { display: flex; align-items: center; gap: 14px; }
  .score { font: 700 40px/1 'Space Grotesk', sans-serif; color: oklch(0.72 0.18 32); }
  .score small { font: 500 13px/1 'IBM Plex Mono', monospace; color: oklch(0.5 0.015 268); }
  .vlabel { font: 500 10px/1.4 'IBM Plex Mono', monospace; letter-spacing: .1em; color: oklch(0.72 0.18 32);
            margin-top: 6px; }
  .cats { flex: 1; display: grid; gap: 4px; }
  .cat { display: grid; grid-template-columns: 64px 1fr 24px; gap: 7px; align-items: center; }
  .cat .lbl { font: 400 9px/1 'IBM Plex Mono', monospace; color: oklch(0.6 0.015 268); }
  .cat.primary .lbl { color: oklch(0.85 0.14 32); }
  .cat .track { height: 4px; border-radius: 2px; background: oklch(0.24 0.018 268); overflow: hidden; }
  .cat .fill { height: 100%; border-radius: 2px; }
  .cat .val { font: 500 9px/1 'IBM Plex Mono', monospace; color: oklch(0.6 0.015 268); text-align: right; }

  .block .eyebrow { font: 400 9px/1 'IBM Plex Mono', monospace; letter-spacing: .12em; margin-bottom: 6px; }
  .roast { padding: 13px 14px; border-radius: 11px; background: oklch(0.22 0.045 36);
           border-left: 2px solid oklch(0.78 0.17 34); }
  .roast .eyebrow { color: oklch(0.82 0.14 45); }
  .roast .quote { font: 500 14.5px/1.5 'Space Grotesk', sans-serif; color: oklch(0.95 0.008 268); }
  .diag .eyebrow, .fix .eyebrow { color: oklch(0.55 0.015 268); }
  .diag .txt { font: 400 12.5px/1.6 'Space Grotesk', sans-serif; color: oklch(0.78 0.012 268); }
  .fixrow { display: flex; align-items: center; justify-content: space-between; }
  .copy { border: 1px solid oklch(0.3 0.02 268); background: transparent; color: oklch(0.65 0.015 268);
          font: 500 9px/1 'IBM Plex Mono', monospace; padding: 4px 7px; border-radius: 5px; cursor: pointer; }
  pre.code { margin-top: 6px; padding: 12px 13px; border-radius: 10px; background: oklch(0.115 0.012 268);
             border: 1px solid oklch(0.27 0.02 268); font: 400 11.5px/1.65 'IBM Plex Mono', monospace;
             color: oklch(0.8 0.05 155); white-space: pre-wrap; max-height: 150px; overflow-y: auto; }
  .actions { display: flex; gap: 8px; }
  .cta { flex: 1; border: none; border-radius: 9px; padding: 11px; cursor: pointer;
         font: 600 12px/1 'Space Grotesk', sans-serif; color: #1a0d08;
         background: linear-gradient(135deg, oklch(0.8 0.15 55), oklch(0.66 0.2 30)); }
  .ghost { border: 1px solid oklch(0.32 0.02 268); background: transparent; color: oklch(0.7 0.015 268);
           border-radius: 9px; padding: 11px 14px; cursor: pointer; font: 600 12px/1 'Space Grotesk', sans-serif; }
  .footer { display: flex; align-items: center; justify-content: space-between;
            font: 400 10px/1 'IBM Plex Mono', monospace; color: oklch(0.5 0.015 268); }
  .kbtn { background: none; border: none; color: oklch(0.72 0.015 268); text-decoration: underline;
          cursor: pointer; font: 400 10px/1 'IBM Plex Mono', monospace; }
  .hint { font: 400 9px/1.4 'IBM Plex Mono', monospace; color: oklch(0.4 0.015 268); text-align: right; }
</style>
</head>
<body>
  <div id="stage">
    <div class="devices" id="devices"></div>

    <div class="card">
      <div class="head">
        <div class="head-top">
          <div><span class="persona">Angry Chef</span><span class="voice">11LABS · EMBER</span></div>
          <div class="head-btns">
            <button class="hbtn" id="mute">🔊 SHUT UP</button>
            <button class="hbtn close" id="close" title="Dismiss">✕</button>
          </div>
        </div>
        <div class="wave" id="wave"></div>
        <div class="status">SPEAKING · STREAMING AUDIO</div>
      </div>

      <div class="body">
        <div class="scorerow">
          <div><div class="score"><span id="score">–</span><small>/100</small></div><div class="vlabel" id="vlabel"></div></div>
          <div class="cats" id="cats"></div>
        </div>

        <div class="block roast">
          <div class="eyebrow">01 · ROAST</div>
          <div class="quote" id="roast"></div>
        </div>

        <div class="block diag">
          <div class="eyebrow">02 · DIAGNOSIS</div>
          <div class="txt" id="diag"></div>
        </div>

        <div class="block fix">
          <div class="fixrow"><div class="eyebrow">04 · BETTER PROMPT</div>
            <button class="copy" id="copy">COPY</button></div>
          <pre class="code" id="code"></pre>
        </div>

        <div class="actions">
          <button class="cta" id="use">Use this prompt</button>
          <button class="ghost" id="ignore">Dismiss</button>
        </div>

        <div class="footer">
          <span id="footer"></span>
          <button class="kbtn" id="kitchen">VIEW KITCHEN</button>
        </div>
      </div>
    </div>

    <div class="hint">⌥⌘Y yell · ⌥⌘G kitchen</div>
  </div>

<script>
  // waveform bars from the handoff seed multipliers
  const seed = [.42,.78,.31,.95,.55,.70,.38,.88,.62,.44,.81,.29,.72,.50,.93,.35,.66,.84,
                .40,.58,.76,.33,.90,.47,.69,.53,.86,.36,.74,.60,.45,.82,.39,.65];
  const wave = document.getElementById('wave');
  seed.forEach((s, i) => {
    const b = document.createElement('span');
    const speak = 34, base = s * speak + (i % 3) * 2;
    b.style.height = Math.max(3, base) + 'px';
    b.style.animation = `gwave ${(0.42 + (i % 5) * 0.13)}s ease-in-out ${(i % 7) * 0.06}s infinite alternate`;
    wave.appendChild(b);
  });
  const style = document.createElement('style');
  style.textContent = '@keyframes gwave { from { transform: scaleY(.55); } to { transform: scaleY(1); } }';
  document.head.appendChild(style);

  // ── Render a verdict (see verdict-contract.js) into the card ──
  const CATS = [
    ['specificity', 'SPEC'], ['tokens', 'TOKENS'], ['frontier', 'FRONTIER'],
    ['tool', 'TOOL'], ['context', 'CONTEXT'], ['verify', 'VERIFY'],
  ];
  const catEl = document.getElementById('cats');
  const scoreColor = (v) =>
    v >= 75 ? 'oklch(0.72 0.15 165)' : v >= 45 ? 'oklch(0.78 0.14 70)' : 'oklch(0.72 0.18 32)';

  function render(v) {
    document.getElementById('score').textContent = v.score;
    document.getElementById('score').style.color = scoreColor(v.score);
    const vlabel = document.getElementById('vlabel');
    vlabel.textContent = v.verdictLabel;
    vlabel.style.color = scoreColor(v.score);
    document.getElementById('roast').textContent = v.roast;
    document.getElementById('diag').textContent = v.diagnosis;
    document.getElementById('code').textContent = v.betterPrompt;
    document.getElementById('footer').textContent = v.footer;

    // category bars
    catEl.innerHTML = '';
    CATS.forEach(([key, lbl]) => {
      const val = v.categories[key] ?? 0;
      const primary = key === v.primaryCategory;
      const row = document.createElement('div');
      row.className = 'cat' + (primary ? ' primary' : '');
      row.innerHTML = `<span class="lbl">${lbl}</span>
        <span class="track"><span class="fill" style="width:${val}%;background:${scoreColor(val)}"></span></span>
        <span class="val">${val}</span>`;
      catEl.appendChild(row);
    });

    // devices fire based on how bad it was
    const devEl = document.getElementById('devices');
    const fire = (name, on) =>
      `<span class="chip${on ? ' firing' : ''}"><span class="dot"${on ? '' : ' style="background:oklch(0.4 0.015 268)"'}></span>${name}</span>`;
    devEl.innerHTML =
      fire('EMBER LAMP', v.severity >= 1) + fire('DESK BUZZER', v.severity >= 2) + fire('BELL-BOT', v.severity >= 3);
  }

  const stage = document.getElementById('stage');
  let hideTimer = null;

  const AUTO_HIDE_MS = 0;                         // 0 = stay until dismissed; set e.g. 14000 for real behavior
  function show() {
    stage.classList.add('show');
    window.gordon?.setInteractive(true);        // capture clicks while visible
    clearTimeout(hideTimer);
    if (AUTO_HIDE_MS > 0) hideTimer = setTimeout(hide, AUTO_HIDE_MS);
  }
  function hide() {
    stage.classList.remove('show');
    clearTimeout(hideTimer);
    setTimeout(() => window.gordon?.setInteractive(false), 300); // back to click-through
  }

  document.getElementById('close').onclick = hide;
  document.getElementById('ignore').onclick = hide;
  document.getElementById('use').onclick = hide;

  // SHUT UP — mute his voice: freeze the waveform, cut audio, keep the text verdict
  const card = document.querySelector('.card');
  const muteBtn = document.getElementById('mute');
  const statusEl = document.querySelector('.status');
  const voiceEl = document.querySelector('.voice');
  let muted = false;
  muteBtn.onclick = () => {
    muted = !muted;
    card.classList.toggle('muted', muted);
    muteBtn.textContent = muted ? '🔇 MUTED' : '🔊 SHUT UP';
    statusEl.textContent = muted ? 'MUTED — HE IS SEETHING' : 'SPEAKING · STREAMING AUDIO';
    voiceEl.textContent = muted ? 'MUTED' : '11LABS · EMBER';
  };
  document.getElementById('kitchen').onclick = () => window.gordon?.openKitchen();
  document.getElementById('copy').onclick = (e) => {
    navigator.clipboard?.writeText(document.getElementById('code').innerText);
    e.target.textContent = 'COPIED ✓';
    setTimeout(() => (e.target.textContent = 'COPY'), 1600);
  };

  // main sends a scored verdict → render it and pop up
  window.gordon?.onVerdict((verdict) => {
    render(verdict);
    show();
  });
</script>
</body>
</html>
