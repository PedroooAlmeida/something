[project]
name = "gordon"
version = "0.1.0"
description = "Gordon Engine — evaluation + voice service (Person 3)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "openai>=1.60",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gordon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
